[project]
name = "lego-tracker"
version = "0.1.0"
description = "Track second-hand LEGO sets, the parts they're missing, and BrickLink wanted lists to complete them."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "catalog*", "collection*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
