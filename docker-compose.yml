x-core: &core
  build:
    context: .
    dockerfile: services/core/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgres://lego:lego@db:5432/core
    RABBITMQ_URL: amqp://lego:lego@rabbitmq:5672/%2F
  volumes:
    - ./services/core:/app

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: lego
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lego -d core"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: lego
      RABBITMQ_DEFAULT_PASS: lego
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (lego / lego)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  core:
    <<: *core
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  core-relay:
    <<: *core
    command: python manage.py relay_outbox
    depends_on:
      core:
        condition: service_healthy   # migrations have run
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
