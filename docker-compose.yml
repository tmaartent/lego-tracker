x-core: &core
  build:
    context: .
    dockerfile: services/core/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgres://lego:lego@db:5432/core
    RABBITMQ_URL: amqp://lego:lego@rabbitmq:5672/%2F
  volumes:
    - ./services/core:/app

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: lego
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lego -d core"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: lego
      RABBITMQ_DEFAULT_PASS: lego
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (lego / lego)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  core:
    <<: *core
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  core-relay:
    <<: *core
    command: python manage.py relay_outbox
    depends_on:
      core:
        condition: service_healthy   # migrations have run
      rabbitmq:
        condition: service_healthy

  watcher:
    build:
      context: .
      dockerfile: services/watcher/Dockerfile
    environment:
      WATCHER_DATABASE_URL: postgresql+psycopg://lego:lego@db:5432/watcher
      WATCHER_RABBITMQ_URL: amqp://lego:lego@rabbitmq:5672/
      WATCHER_CORE_URL: http://core:8000
      WATCHER_HOME_POSTCODE: "3600"
      WATCHER_POLL_INTERVAL_SECONDS: "60"
    ports:
      - "8001:8001"   # API docs: http://localhost:8001/docs
    volumes:
      - ./services/watcher/watcher:/app/watcher
      - ./services/watcher/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 20

  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    env_file: .env   # NOTIFIER_TELEGRAM_BOT_TOKEN and NOTIFIER_TELEGRAM_CHAT_ID
    environment:
      NOTIFIER_DATABASE_URL: postgresql+psycopg://lego:lego@db:5432/notifier
      NOTIFIER_RABBITMQ_URL: amqp://lego:lego@rabbitmq:5672/
    ports:
      - "8002:8002"   # API docs: http://localhost:8002/docs
    volumes:
      - ./services/notifier/notifier:/app/notifier
      - ./services/notifier/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
