[project]
name = "lego-tracker-watcher"
version = "0.1.0"
description = "Polls marketplaces for listings that match a watch and announces them as events."
requires-python = ">=3.12"
dependencies = [
    "lego-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faststream[rabbit]>=0.7,<0.8",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watcher*"]

[tool.setuptools.package-data]
"watcher.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # SQLite stores Decimals as floats; tests use whole cents, PostgreSQL is exact.
    "ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively",
]
